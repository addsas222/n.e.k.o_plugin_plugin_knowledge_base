[plugin]
id = "plugin_knowledge_base"
name = "Plugin Knowledge Base"
version = "0.1.0"
type = "plugin"
description = "知识库：导入 .md/.txt/.pdf 文件，按段落分块（默认 240 tokens / 重叠 64，可配置；MiniLM 窗口 256），用 all-MiniLM-L6-v2（ONNX，384 维，CPU）向量化，vec0 + FTS5 混合检索（向量余弦 + BM25，RRF 融合）；滑动窗口热度追踪在窗口内命中达到阈值时自动把知识块提升到数据库插件的 hot_knowledge 表。"
short_description = "File knowledge base with ONNX embeddings, hybrid vector+BM25 search, and sliding-window hot-knowledge promotion into plugin_database."
keywords = [
    "知识库",
    "knowledge",
    "检索",
    "搜索",
    "向量",
    "embedding",
    "语义搜索",
    "rag",
    "文档",
    "热知识",
]
entry = "plugin.plugins.plugin_knowledge_base:PluginKnowledgeBasePlugin"

[plugin.author]
name = "neko-plugin"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false
# 嵌入模型(约90MB)冷加载+探测超过默认启动窗口，给足启动超时
timeout = 120

# ---------------------------------------------------------------------------
# 业务配置：首次运行复制到用户数据目录 config/plugin.toml，改那份才生效。
# ---------------------------------------------------------------------------

[knowledge]
# 嵌入模型目录；留空 = <插件数据>/models/all-MiniLM-L6-v2（缺失时先调
# kb_model_download 入口下载，或指向插件自带的 models/ 目录）。
models_dir = ""

[hot_promotion]
window_days = 7          # 滑动窗口天数
threshold = 5            # 窗口内命中次数阈值
demotion_days = 30       # 冷数据降级天数

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "Plugin Knowledge Base"
entry = "ui/panel.tsx"
context = "plugin_knowledge_base_panel"
permissions = ["state:read", "action:call"]
